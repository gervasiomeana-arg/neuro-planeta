name: Comprobar diseño y accesibilidad
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run test:security
      - name: Comprobar Chrome del entorno
        run: google-chrome --version
      - name: Comprobar arranque de Chrome
        timeout-minutes: 1
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: 'chrome', timeout: 20000 });
          await browser.close();
          JS
      - name: Probar versión candidata
        run: npx playwright test
      - name: Probar web publicada
        if: always()
        continue-on-error: true # El sitio publicado puede estar esperando el despliegue del candidato.
        run: npx playwright test tests/functional.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://gervasiomeana-arg.github.io/neuro-planeta/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-de-diseno
          path: test-results/
