name: Comprobar diseño y accesibilidad
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Probar versión candidata
        run: npx playwright test
      - name: Probar web publicada
        if: always()
        continue-on-error: true # El sitio publicado puede estar esperando el despliegue del candidato.
        run: npx playwright test tests/functional.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://gervasiomeana-arg.github.io/neuro-planeta/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-de-diseno
          path: test-results/
