name: Publicar NeuroPlaneta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuro-planeta-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Compilar cliente y servidor fuera de archivos públicos
        run: npm run build
      - name: Preparar cliente para GitHub Pages
        run: npx vite build --base=/neuro-planeta/
      - name: Bloquear publicación si falla seguridad
        run: npm run test:security
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
