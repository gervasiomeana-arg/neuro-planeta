name: Aislamiento de familias
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'family-tests/**'
      - 'package*.json'
      - '.github/workflows/family-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Probar permisos con dos familias ficticias y sin proyecto real
        run: npm run test:families
